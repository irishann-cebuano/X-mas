<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Merry Christmas 🎄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1 class="glow">🎄 Merry Christmas 🎄</h1>
    <p>Wishing you joy, love, and peace this season ✨</p>

    
    <button class="btn">Open Gift 🎁</button>
    <button id="play-music">🎵 Play Music</button>
    <button id="mute-btn">🔊 Mute</button>


    <div class="gift" id="gift">
      <img src="mwaa.gif" alt="Gift" id="gif-img">
      <p id="gift-msg">🎄 Wishing you a Merry Christmas filled with joy and surprises! ✨</p>
    </div>
  </div>

  
  <audio id="bg-music" loop>
    <source src="christmas.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script src="script.js"></script>
</body>
</html>
